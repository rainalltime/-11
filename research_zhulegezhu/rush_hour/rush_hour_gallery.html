<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rush Hour 关卡图鉴 · 猪了个猪参考</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--fg:#e2e8f0;--muted:#94a3b8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  h1{font-size:22px;margin:8px 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:860px;width:100%}
  .head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .badge{background:#334155;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--fg)}
  .badge.red{background:#e5484d;color:#fff}
  .badge.green{background:#22c55e;color:#06281a}
  .cols{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
  .col{text-align:center}
  .col h3{font-size:14px;margin-bottom:8px;color:var(--muted);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(6,52px);grid-template-rows:repeat(6,52px);gap:4px;margin:0 auto}
  .cell{border-radius:8px;border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
  .c-e{background:#0b1220}
  .c-w{background:#475569}
  .c-p{background:var(--pc,#3b82f6);color:#fff}
  .arrow{font-size:20px;font-weight:900}
  .info{margin-top:16px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted)}
  .nav{display:flex;align-items:center;gap:12px;margin-top:18px;justify-content:center}
  button{background:#3b82f6;border:none;color:#fff;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer}
  button:hover{filter:brightness(1.1)}
  button.ghost{background:#334155}
  #idx{font-size:14px;color:var(--fg);min-width:90px;text-align:center}
  #indexGrid{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:6px}
  #indexGrid button{background:#1e293b;border:1px solid var(--line);border-radius:6px;padding:6px 0;font-size:12px}
  #indexGrid button.cur{background:#3b82f6}
  #indexGrid button.bad{background:#7f1d1d;color:#fca5a5}
  details{margin-top:14px}
  summary{cursor:pointer;color:var(--muted);font-size:13px}
  .legend{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<h1>🚗 Rush Hour 关卡图鉴</h1>
<div class="sub">40 关经典 ThinkFun + 150 关全量数据库最难 · 右侧为转换到「猪了个猪」的可玩关卡</div>
<div class="card">
  <div class="head">
    <span class="badge" id="bSource"></span>
    <span class="badge red" id="bMoves"></span>
    <span class="badge green" id="bChain"></span>
  </div>
  <div class="cols">
    <div class="col">
      <h3>原始 Rush Hour 棋盘</h3>
      <div class="grid" id="gOrig"></div>
      <div class="legend">红块 = 目标红车 A · 字母 = 车辆 · 深灰 = 墙</div>
    </div>
    <div class="col">
      <h3>猪了个猪转换版</h3>
      <div class="grid" id="gConv"></div>
      <div class="legend">箭头 = 猪滑出方向 · 深灰 = 障碍</div>
    </div>
  </div>
  <div class="info">
    <span id="iPig"></span><span id="iWall"></span><span id="iCluster"></span><span id="iConv"></span>
  </div>
  <details><summary>查看原始 ASCII / 转换数据</summary>
    <pre id="raw" style="font-size:12px;margin-top:8px;overflow:auto;max-height:200px;background:#0b1220;padding:10px;border-radius:8px"></pre>
  </details>
  <div class="nav">
    <button class="ghost" id="btnPrev">◀ 上一关</button>
    <span id="idx">1 / 190</span>
    <button id="btnNext">下一关 ▶</button>
  </div>
  <div id="indexGrid"></div>
</div>

let cur = 0;
function render(){
  const m = DATA[cur];
  const id = cur+1;
  document.getElementById('idx').textContent = id+' / '+DATA.length;
  document.getElementById('bSource').textContent = m.source;
  document.getElementById('bMoves').textContent = 'RushHour 最少 '+m.moves+' 步';
  document.getElementById('bChain').textContent = '猪了个猪 依赖链 '+m.chain;

  document.getElementById('iConv').textContent = convok ? '✓ 可解(贪心验证)' : '✗ 未转换(含3格卡车/无法满足单向)';

  const go = document.getElementById('gOrig'); go.innerHTML='';
  for(const c of m.cell){
    const d=document.createElement('div');
    if(c.t==='e'){d.className='cell c-e'}
    else if(c.t==='w'){d.className='cell c-w';d.textContent='#'}
    else{d.className='cell c-p';d.style.setProperty('--pc',c.c);d.textContent=c.lab}
    go.appendChild(d);
  }
  // converted
  const gc = document.getElementById('gConv'); gc.innerHTML='';
  if(convok){
    for(const c of m.conv){
      const d=document.createElement('div');
      if(c.t==='e'){d.className='cell c-e'}
      else if(c.t==='w'){d.className='cell c-w'}

    }
    for(const p of m.pigs){

      const idx = p.y*6+p.x;
      const d = gc.children[idx];
      d.textContent = ARROW[p.d];
    }
  }
  // raw
  document.getElementById('raw').textContent = JSON.stringify(m, null, 1);
  // index grid
  const gi = document.getElementById('indexGrid'); gi.innerHTML='';
  DATA.forEach((mm, i)=>{

    b.textContent = i+1;
    if(!mm.conv.length) b.classList.add('bad');

document.getElementById('btnNext').onclick=()=>{cur=(cur+1)%DATA.length;render()};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'){cur=(cur-1+DATA.length)%DATA.length;render()}
  if(e.key==='ArrowRight'){cur=(cur+1)%DATA.length;render()}
});
render();
